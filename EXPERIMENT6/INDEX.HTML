<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 6</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="heading">Welcome to JavaScript Lab</h1>

      <input type="text" id="inputText" placeholder="Enter new heading" />

      <div class="btn-group">
        <button id="btnText">Change Heading</button>
        <button id="btnColor">Change Background</button>
        <button id="btnFont">Increase Font Size</button>
        <button id="btnToggle">Show/Hide Paragraph</button>
        <button id="btnReset">Reset</button>
      </div>

      <p id="para">
        This is a sample paragraph JavaScript events can dynamically change
        content.
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
